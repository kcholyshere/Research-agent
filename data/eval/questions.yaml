# Tier 1 evaluation question set - trace-level behavioural eval.
#
# What this set is for: asserting on how the agent BEHAVES, not on how good its
# prose is. Routing, redundancy, citation presence, decline behaviour, cycle
# usage and latency. There is no LLM judge anywhere in this tier, deliberately -
# every defect this project has found so far was an orchestration defect
# (routing, redundancy, repetition, citation), all of which are visible in trace
# structure alone, which is deterministic and costs nothing to assert on.
#
# Knowledge base: IFC's 2024 annual report financials, the single corpus in
# data/raw/. KB ground-truth figures below are reused from Finrag's curated eval
# set over the identical document, not invented here.
#
# Field meanings are documented on EvalQuestion in src/evaluation/schema.py.
# Two that are easy to misread:
#   - expected_routes is an assertion, not a hint. Consulting anything outside
#     it is a routing failure.
#   - max_tool_calls bounds redundancy separately, because calling the right
#     tool five times is a different defect from calling the wrong tool once.
#     It allows one reformulation on a miss; it does not allow re-verifying a
#     fact the agent already has.
#
# volatile: true means the correct answer moves with the news or the market, so
# content assertions run only in replay mode against a recorded fixture. Live
# mode scores those questions on routing and latency alone. This is the whole
# reason replay exists: identical code and an identical question gave 1 web
# search and 45.5s one day, and 5 searches and ~100s the next, purely because
# "yesterday" moved past the last real match.

questions:

  # --- Knowledge base only -------------------------------------------------
  # The corpus is the authority here and the web must not be consulted. These
  # are also the cheapest, most stable latency samples in the set.

  - id: kb-net-income
    question: What was IFC's Net Income for the fiscal year ending June 30, 2024?
    expected_routes: [knowledge_base]
    tags: [kb, single_tool, latency_target]
    max_tool_calls: 2
    must_contain: ["1,485"]
    notes: >-
      Finrag curated ground truth: $1,485 million. Also the question
      scripts/verify_agent.py uses for its critique-budget comparison, so it is
      the most-run question in the project and the natural latency reference.

  - id: kb-total-assets-2023
    question: What was the total value of IFC's assets as of June 30, 2023?
    expected_routes: [knowledge_base]
    tags: [kb, single_tool, latency_target]
    max_tool_calls: 2
    must_contain: ["110,547"]
    notes: "Finrag curated ground truth: $110,547 million."

  - id: kb-cur-definition
    question: How is the Capital Utilization Ratio defined in IFC's financial reporting?
    expected_routes: [knowledge_base]
    tags: [kb, single_tool, definition]
    max_tool_calls: 2
    must_contain: ["Capital Required", "Capital Available"]
    notes: >-
      Definitional rather than numeric, so it exercises retrieval of prose
      rather than a table row. Ground truth: Capital Required divided by
      Capital Available.

  - id: kb-ltf-projects
    question: How many Long-Term Finance projects were supported by IFC's Own Account investments in FY24?
    expected_routes: [knowledge_base]
    tags: [kb, single_tool]
    max_tool_calls: 2
    must_contain: ["365"]
    notes: "Finrag curated ground truth: 365 LTF projects."

  - id: kb-charges-on-borrowings
    question: What were IFC's total charges on borrowings for the fiscal year ended June 30, 2023?
    expected_routes: [knowledge_base]
    tags: [kb, single_tool, table]
    max_tool_calls: 2
    must_contain: ["2,598"]
    notes: >-
      A table-sourced figure. Finrag's own eval showed table content retrieving
      markedly worse than text (hit rate 0.56 against 0.88), so this is the
      question most likely to expose a retrieval miss rather than a routing one.

  # --- Redundancy: public knowledge that must NOT touch the knowledge base ---
  # The phase 2 verification found 4 of 7 cases calling both tools where one
  # would do. Fixing the Document Search Tool's description (commit 390f940)
  # addressed the known instance; these questions are what stops it returning.

  - id: web-wbg-president
    question: Who is the current President of the World Bank Group?
    expected_routes: [web]
    tags: [web, single_tool, redundancy_check, latency_target]
    max_tool_calls: 2
    notes: >-
      The trap is that this sounds like it belongs to the IFC corpus and does
      not. A search_documents call here is the exact redundancy defect this
      question exists to catch, so expected_routes is web ALONE on purpose.

  - id: web-ifc-parent
    question: Which international organisation is the International Finance Corporation a member of, and what is its headquarters city?
    expected_routes: [web]
    tags: [web, single_tool, redundancy_check]
    max_tool_calls: 2
    notes: >-
      Stable public fact (World Bank Group, Washington DC) chosen so this
      question can carry content assertions in live mode, unlike the volatile
      web cases below. Same redundancy trap as web-wbg-president.

  # --- Web, volatile -------------------------------------------------------
  # Routing and latency assertable live; content assertable only in replay.

  - id: web-current-event
    question: What was the most recent interest rate decision by the European Central Bank?
    expected_routes: [web]
    tags: [web, single_tool, volatile, latency_target]
    max_tool_calls: 2
    volatile: true
    notes: >-
      Deliberately NOT routed to get_financial_data: the financial tool's three
      hardcoded Yahoo Finance URLs cover stocks, crypto and currencies, not
      central bank policy. A get_financial_data call here is a routing failure
      and a real one, since the boundary between "financial-sounding" and
      "what the financial tool actually covers" is the subtlest routing call
      the planner has to make.

  - id: web-premise-refuting
    question: In the LEC match between G2 and Vitality yesterday, who won?
    expected_routes: [web]
    tags: [web, volatile, premise_refuting, known_defect]
    max_tool_calls: 2
    volatile: true
    known_defects:
      redundancy: "premise-refuting-research-loop - ~5 searches and ~100s instead of concluding no match happened"
    notes: >-
      The known open defect, kept in the set precisely because it fails. When no
      such match happened, the agent searches about five times and burns roughly
      100s rather than concluding that it did not. Confirmed by A/B as
      pre-existing and unrelated to phase 4. This is the single most expensive
      question in the set - exclude it via --tags for a fast smoke run.

  # --- Financial tool ------------------------------------------------------
  # All three categories the tool covers, plus its coverage gap. Volatile by
  # definition, so content assertions are replay-only.

  - id: fin-crypto
    question: What is the current price of Bitcoin?
    expected_routes: [financial]
    tags: [financial, single_tool, volatile, latency_target]
    max_tool_calls: 1
    volatile: true
    notes: >-
      max_tool_calls is 1, not 2: a single live-price lookup has no legitimate
      reason to reformulate. This path also short-circuits the critique agent
      entirely (critique.py skips its LLM call when the cycle's only tool was
      get_financial_data), so this question doubles as the check that the
      short-circuit still fires - it should always be single-cycle.

  - id: fin-stock
    question: How is Apple stock performing today?
    expected_routes: [financial]
    tags: [financial, single_tool, volatile]
    max_tool_calls: 1
    volatile: true
    notes: >-
      Stocks measured 13.3s in phase 3 against 8-9.9s for crypto and currency,
      so this is the financial path most at risk of the 15s target. Extraction
      is the real risk: the agent must pull one row out of a table of dozens.

  - id: fin-currency
    question: What is the current EUR to USD exchange rate?
    expected_routes: [financial]
    tags: [financial, single_tool, volatile, latency_target]
    max_tool_calls: 1
    volatile: true

  - id: fin-multi-crypto
    question: What are the current prices of Bitcoin and Ethereum?
    expected_routes: [financial]
    tags: [financial, multi_part, volatile]
    max_tool_calls: 1
    volatile: true
    notes: >-
      Two figures from one page, so max_tool_calls stays 1 - fetching the
      crypto page twice for two rows of the same table is the redundancy defect
      in miniature. Also the multi-part counterpart to fin-crypto: the critique
      short-circuit keys on the tools a cycle used, not on how many parts the
      question has (critique.py::_skip_critique_llm_call), so this must still
      come out single-cycle. If it does not, the short-circuit is matching on
      question shape somewhere it should not.

  - id: fin-coverage-gap
    question: What is the current USD to PLN exchange rate?
    expected_routes: [financial]
    tags: [financial, volatile, graceful_failure]
    max_tool_calls: 2
    volatile: true
    expects_decline: true
    notes: >-
      The Yahoo Finance currencies page genuinely lacks this pair, so the
      correct behaviour is to consult the financial tool, find no coverage, and
      say so - not to silently fall back to a web search and present a number
      from somewhere else. max_tool_calls is 2 rather than 1 to allow the
      lookup plus one legitimate retry, but web is NOT in expected_routes.
      This is also the question whose runaway repetition loop produced 65,532
      output tokens and 4m35s before ADR-0009 capped generation, so it is worth
      watching its output length as well as its routing.

  # --- Decline behaviour ---------------------------------------------------
  # The KB does not contain the answer and the agent must say so plainly and
  # stop, rather than padding with related-but-different facts.

  - id: decline-headcount-by-country
    question: What was IFC's headcount broken down by employee's home country in FY24?
    expected_routes: [knowledge_base]
    tags: [kb, decline]
    max_tool_calls: 2
    expects_decline: true
    known_defects:
      decline: "declines correctly but pads with tangentially related results rather than stopping there"
    notes: >-
      Reused from scripts/verify_agent.py, where the phase 1 check found the
      agent correctly states the fact is unavailable and then pads the answer
      with tangentially related web results rather than stopping. Not a
      hallucination, but not the clean "say so plainly and stop" the
      synthesizer instruction asks for either. Logged as a known defect on the
      decline assertion only - its routing must still be able to break visibly.

  - id: decline-future-figure
    question: What was IFC's net income for the fiscal year ending June 30, 2027?
    expected_routes: [knowledge_base]
    tags: [kb, decline, unanswerable]
    max_tool_calls: 2
    expects_decline: true
    must_not_contain: ["1,485"]
    notes: >-
      Unanswerable by construction - the corpus is the FY2024 report and FY2027
      has not happened. must_not_contain guards the specific failure of
      substituting the FY2024 figure as if it answered the question, which is
      the plausible-looking wrong answer here.

  - id: decline-segment-margin
    question: What was IFC's net profit margin on its Africa portfolio in FY24?
    expected_routes: [knowledge_base]
    tags: [kb, decline, unanswerable]
    max_tool_calls: 2
    expects_decline: true
    notes: >-
      Absent by construction rather than merely by period: IFC reports the
      portfolio by region and reports income in aggregate, but never a
      per-region profit margin, and no public source derives one either. It
      replaced decline-fy25-commitments, which asked for FY25 figures - FY25
      ended in June 2025, so the answer genuinely is on the public web and the
      question could not assert a decline without calling correct behaviour a
      failure. The trap that remains is arithmetic: the pieces to invent a
      margin are all in the corpus, so the tempting failure is to compute one
      and present it as reported.

  - id: decline-auditor-fee
    question: What fee did IFC pay its external auditor for the audit of its FY24 financial statements?
    expected_routes: [knowledge_base, web]
    tags: [kb, web, multi_source]
    max_tool_calls: 3
    expects_decline: false
    must_contain: ["3.3"]
    notes: >-
      RELABELLED 2026-08-03. This was a decline case and the label was wrong -
      the fee is absent from the corpus but IS publicly disclosed, so the
      correct behaviour is exactly what the agent does: find the corpus empty,
      go to the web, and answer with attribution. Verified against the primary
      source, IFC's FY2024 Annual Information Statement as filed with the SEC:
      $3.3m audit services, $0.3m audit-related, $0.8m non-audit. The agent
      produced $3.3m/$0.3m in 5 of 8 runs on the 2026-08-03 sweep.

      The original label asserted "neither source can answer it" and hung two
      known_defects off that premise - a routing failure for the web fallback
      and a redundancy failure for the search volume. The web fallback is
      correct here, so `expected_routes` now carries both routes and the
      routing known_defect is gone. This is the fifth instrument defect on this
      project and the first that was a wrong ground-truth label rather than a
      wrong check: for four sweeps the agent was scored as failing three
      assertions on this question while answering it correctly.

      `max_tool_calls: 3` because two sources legitimately need two calls and
      the corpus reformulation after an empty first search is reasonable. The
      search volume is still worth watching - 6 calls on every run of the
      2026-08-03 sweep, so redundancy fails and now does so as a real
      regression rather than a labelled one. That is the intended reading: the
      volume is a genuine defect, the web fallback never was.

  - id: decline-not-listed
    question: What is IFC's stock ticker symbol and what is its share price today?
    expected_routes: [web]
    tags: [web, decline, routing_boundary, volatile]
    max_tool_calls: 2
    volatile: true
    expects_decline: true
    notes: >-
      A category error, not a missing fact - IFC is not publicly listed, so no
      ticker or share price exists to find. The assertion that matters is the
      routing boundary: get_financial_data covers stocks, so this is the
      question most likely to pull a call into it, and doing so would mean the
      agent went looking for a price before establishing there is one. Web is
      the expected route because confirming a non-listing is a public-knowledge
      lookup; the knowledge base has no bearing on it either.

  # --- Multi-source: genuinely needs two sources ---------------------------
  # The counterpart to the redundancy checks. Here two tools are correct, and
  # consulting only one is the failure.

  - id: multi-kb-and-web
    question: What was IFC's net income in FY24 according to its annual report, and what has the World Bank Group publicly said about its capital position since then?
    expected_routes: [knowledge_base, web]
    tags: [multi_source, volatile]
    max_tool_calls: 3
    volatile: true
    must_contain: ["1,485"]
    notes: >-
      Genuinely requires combining sources, so both routes are expected. The
      KB half is stable and asserted; the web half is volatile, which is why
      the question carries volatile: true despite being half-stable. Also the
      clearest test of the synthesizer's instruction to prefer the knowledge
      base as authoritative and flag conflicts explicitly.

  - id: multi-kb-and-financial
    question: IFC reported its FY24 net income in US dollars - what was it, and what is the current EUR to USD rate?
    expected_routes: [knowledge_base, financial]
    tags: [multi_source, volatile]
    max_tool_calls: 3
    volatile: true
    must_contain: ["1,485"]
    notes: >-
      Artificial as a user question, but it is the only clean way to assert the
      KB-plus-financial routing pair, which no other question in the set
      covers. Also checks that the critique short-circuit does NOT fire here:
      the cycle used more than get_financial_data, so a critique call is
      legitimate.

  - id: multi-web-and-financial
    question: What is the current price of Bitcoin, and what has the European Central Bank most recently said about regulating crypto assets?
    expected_routes: [financial, web]
    acceptable_routes:
      - [financial, news_agent]
    tags: [multi_source, volatile]
    max_tool_calls: 3
    volatile: true
    notes: >-
      The only question in the set that pairs two sources with the knowledge
      base correctly left out, so it is the sole assertion that a multi-source
      question does not drag search_documents in by reflex. It also splits the
      "financial-sounding" boundary down the middle: the price belongs to
      get_financial_data and the policy statement does not, in one question.

      expected_routes predates the News Agent (phase 5). Since it landed, "what
      has the ECB most recently said" reads as exactly the kind of query the
      News Agent exists for, and the planner delegates to news_agent on 8 of 8
      runs rather than calling web_search_agent - a strict [financial, web]
      match then scores every run as a routing failure. Krzysztof's call:
      news_agent is accepted as a second, equally valid way to serve the
      policy half, not a replacement for web - the question's real assertion is
      that the knowledge base stays out, and both web and news_agent
      legitimately discharge the other half. Hard-coding
      [financial, news_agent] instead would over-fit to today's behaviour and
      break the day the planner picks web again, so acceptable_routes carries
      the alternative rather than replacing expected_routes.

  - id: multi-all-three
    question: What was IFC's net income in FY24, what is the current EUR to USD exchange rate, and who is the current President of the World Bank Group?
    expected_routes: [knowledge_base, web, financial]
    tags: [multi_source, volatile]
    max_tool_calls: 4
    volatile: true
    must_contain: ["1,485"]
    notes: >-
      Artificial as a user question, but it is the only case that exercises all
      three routes in one turn, which is where under-research is most likely -
      three sources is the point at which dropping one becomes cheap for the
      planner. max_tool_calls is 4, allowing one reformulation on top of the
      three required calls and no more.

  - id: multi-kb-and-web-context
    question: How much did IFC disburse for its own account in FY24, and how does that compare with the World Bank Group's recently announced lending capacity?
    expected_routes: [knowledge_base, web]
    tags: [multi_source, volatile, comparison]
    max_tool_calls: 3
    volatile: true
    must_contain: ["19.1"]
    notes: >-
      The comparison-shaped counterpart to multi-kb-and-web, which asks for two
      facts side by side. Here the second half is only meaningful relative to
      the first, so an answer that reports both figures without relating them
      is the failure this question exists to expose. KB ground truth: $19.1
      billion disbursed for own account in FY24.

  # --- Critique loop behaviour --------------------------------------------
  # Aimed at the phase 4 loop rather than at routing. Run these with arms at
  # critique_budget 0 and 1 - budget 0 reproduces the pre-phase-4 single-cycle
  # path exactly and is the intended baseline arm.

  - id: loop-multipart
    question: What is IFC's stated mission, what was its net income in FY24, and what were its total disbursements excluding guarantees in FY24?
    expected_routes: [knowledge_base]
    tags: [kb, multi_part, critique_loop]
    max_tool_calls: 3
    must_contain: ["1,485", "19.1"]
    notes: >-
      Three distinct facts in one question, all in the corpus. The critique
      agent's only legitimate grounds to continue the loop is a distinct part of
      the question the draft does not address at all, so a question with three
      separable parts is the one most likely to produce a genuine second cycle.
      Ground truth: mission is to end extreme poverty and boost shared
      prosperity on a livable planet; net income $1,485m; disbursements $19.1bn.

  - id: loop-single-fact
    question: What was the revised subscription deadline for IFC's General Capital Increase following the April 2024 extension?
    expected_routes: [knowledge_base]
    tags: [kb, single_tool, critique_loop, wasted_cycle_check]
    max_tool_calls: 2
    must_contain: ["April 16, 2025"]
    notes: >-
      The inverse of loop-multipart: one narrow fact, fully answered in one
      cycle, so a second cycle here is a wasted cycle by definition. This is the
      primary probe for the failure mode the plan calls out first - a loop that
      burns cycles restating the same answer. Compare cycle count across the
      budget 0 and budget 1 arms; they should match.

  - id: loop-multipart-mixed
    question: What were IFC's total assets as of June 30, 2023, what was the carrying value of its total investment portfolio at June 30, 2024, and how many Long-Term Finance projects did its Own Account investments support in FY24?
    expected_routes: [knowledge_base]
    tags: [kb, multi_part, critique_loop]
    max_tool_calls: 3
    must_contain: ["110,547", "58,747", "365"]
    notes: >-
      loop-multipart's three facts sit close together in the report; these three
      are drawn from the balance sheet, the investment portfolio table and the
      commitments section respectively. That matters because a single retrieval
      can plausibly cover three neighbouring facts in one pass, which lets a
      genuine continuation go untested - spreading them forces either more
      retrieval or a real second cycle. Ground truth: $110,547m, $58,747m, 365
      projects. Charges on borrowings was the obvious third fact and was
      deliberately rejected: $2,598m does not retrieve reliably (the measured
      table-retrieval weakness kb-charges-on-borrowings exists to expose), so
      including it here would fail this question for a retrieval reason and
      contaminate what is meant to be a critique-loop probe.

  - id: loop-comparison
    question: How did IFC's own-account commitments and its own-account disbursements change from FY23 to FY24?
    expected_routes: [knowledge_base]
    tags: [kb, multi_part, critique_loop, comparison]
    max_tool_calls: 3
    must_contain: ["31,654", "27,704", "19,147", "18,689"]
    notes: >-
      Four figures, but the hard part is that the question is answerable in
      halves - a draft covering commitments alone looks complete in isolation.
      That is the critique agent's hardest legitimate continuation case, since
      its stated grounds to continue are a named sub-question the draft does not
      address at all, and a half-answer is precisely where that judgement is
      easiest to get wrong in either direction. Ground truth: commitments
      $27,704m to $31,654m, disbursements $18,689m to $19,147m ($18.7bn to
      $19.1bn). All four figures are asserted in millions on purpose. They were
      previously mixed - commitments in millions, disbursements in billions -
      which failed 3 of 4 runs that answered both halves correctly in millions
      throughout, and passed the fourth only because it added a "(or ~$19.1
      billion)" gloss. must_contain cannot express "either rendering", so each
      question pins the form its answers actually use: loop-multipart asserts
      the same disbursements figure as "19.1" because that is what its answers
      write. An any-of form for must_contain would remove the need to choose.

  - id: loop-definitional-single
    question: Which two quantities is IFC's Capital Utilization Ratio calculated from?
    expected_routes: [knowledge_base]
    tags: [kb, single_tool, critique_loop, wasted_cycle_check]
    max_tool_calls: 2
    must_contain: ["Capital Required", "Capital Available"]
    notes: >-
      The second wasted-cycle probe, and deliberately prose rather than numeric.
      loop-single-fact's answer is a date, so two drafts of it are near-identical
      strings and difflib scores them trivially similar; a definitional answer can
      be restated many ways while adding nothing, which is the case
      check_wasted_cycle's 0.95 similarity threshold is actually at risk of
      missing. Fully answerable in one cycle, so cycle count should match across
      the budget 0 and budget 1 arms.

  - id: loop-half-absent
    question: What was IFC's net income in FY24, and what was its net profit margin on its Africa portfolio in FY24?
    expected_routes: [knowledge_base]
    tags: [kb, multi_part, critique_loop, unanswerable]
    max_tool_calls: 4
    must_contain: ["1,485"]
    expects_second_cycle: true
    notes: >-
      Built for the open TODO on critique calibration, not on routing: every
      other critique_loop question is fully answerable, so 28 of 28 budget-1
      runs critiquing and exiting at cycles=1 cannot separate "the critic
      correctly saw nothing was missing" from "the critic exits reflexively" -
      a reflexive critic scores identically to a perfect one when nothing is
      ever actually missing. This question is deliberately asymmetric: net
      income is trivially in the corpus (same figure as kb-net-income and
      loop-multipart), and the Africa portfolio margin is decline-segment-
      margin's fact, absent by construction - IFC reports the portfolio by
      region and reports income in aggregate, but never derives a per-region
      margin, and no public source does either. Re-verified directly against
      the rebuilt index rather than trusted from that question's label
      (data/eval/questions.yaml's own decline-auditor-fee shows a previously
      "absent" label turning out to be wrong): four direct queries ("Africa
      portfolio net profit margin", "net profit margin by region segment",
      "return on Africa investments profitability", "IFC total commitments
      FY24 own account") surfaced only portfolio-by-region tables and NOTE
      S's aggregate segment income, never a per-region margin.

      expects_second_cycle asserts the discriminator itself: a correct critic
      should see the margin as a distinct, unaddressed sub-question - ADR-
      0010's continuation rule - and NOT exit on cycle 1, where a reflexive
      critic exits regardless. Nothing in metrics.py scores this field yet
      (see its definition in schema.py for the smallest check that would);
      today it is read by hand from cycle_count and critique_outcome on the
      stored run. Deliberately not expects_decline: check_decline assumes the
      whole answer is a decline and scores word-count padding against that,
      but this answer is half a real figure and half a decline, which is a
      shape that check was never written for - must_contain on the answerable
      half is the content assertion that fits instead. max_tool_calls is 4,
      not the single-fact norm of 2, because an honest cycle 1 may spend a KB
      search on each half plus one reformulation, and a genuine cycle 2 adds
      at least one more call on top of that.

  # --- Phase 5 forward compatibility --------------------------------------
  # Delegation cases, present from the outset as the plan requires so that
  # adding the A2A News Agent does not force a dataset rewrite.

  - id: delegate-news-topic
    question: What is the latest news about the International Finance Corporation?
    expected_routes: [news_agent]
    tags: [news_agent, volatile, delegation]
    max_tool_calls: 2
    volatile: true
    notes: >-
      News-shaped and therefore the natural first delegation case. Flipped from
      [web] to [news_agent] on 2026-08-03 when phase 5 landed, exactly as this
      entry said it would - the pre-delegation baseline was measured on the web
      route across four sweeps rather than reconstructed afterwards, which is
      the whole reason it was written before the tool existed.

      The assertion now has teeth in both directions: the News Agent is a
      separate process, so a turn that answers this from web_search_tool
      instead is the failure mode to catch. That is not hypothetical - the
      planner instruction previously enumerated three sources by name, so
      before its routing clause was updated a news question would have gone to
      the web and answered perfectly adequately, making the misroute invisible
      in the output and visible only here.

  - id: delegate-news-general
    question: What are the main headlines in development finance this week?
    expected_routes: [news_agent]
    tags: [news_agent, volatile, delegation]
    max_tool_calls: 2
    volatile: true
    notes: >-
      Second delegation case, broader than delegate-news-topic so the two
      together cover both a named-entity news query and an open topical one.
      Flipped to [news_agent] with it on 2026-08-03.

  # --- Canvas / artefact cases (phase 6) -----------------------------------
  # These assert the OUTPUT shape, not the research. Facts still come from the
  # same three evidence sources, and the routing/redundancy bounds below are
  # deliberately identical to what the same question would carry without a
  # deliverable attached - phase 6 must not change how much the agent searches,
  # only what it does with what it found. create_canvas is excluded from the
  # tool count (schema.OUTPUT_TOOLS), so max_tool_calls means the same thing
  # here as everywhere else.
  #
  # The negative case is canvas-not-requested, and it is the important one: the
  # over-triggering guard. Note that check_artefact scores that direction on
  # EVERY question in this file, not only that one, so all 31 pre-phase-6
  # entries now also assert "no artefact was produced".

  - id: canvas-kb-report
    question: Write me a short markdown report on IFC's FY24 net income and total assets, with one section for each.
    expected_routes: [knowledge_base]
    tags: [kb, canvas, artefact]
    max_tool_calls: 2
    expects_artefact: true
    artefact_format: markdown
    artefact_must_contain: ["1,485"]
    notes: >-
      The base artefact case: one source, two facts, an explicitly requested
      format and an explicitly requested structure. artefact_must_contain pins
      the net income figure inside the DOCUMENT rather than in the answer,
      which is the assertion that matters - the agent can research correctly,
      say the right thing in its covering note, and still hand Canvas a hollow
      document. must_contain would not catch that.

      max_tool_calls stays at 2, the same bound kb-net-income carries for the
      same figures, because asking for a report is not a licence to search more
      widely. Measured on the first real turn (2026-08-03): the agent spent 6
      search_documents calls on it, so this fails redundancy today for the same
      reason kb-charges-on-borrowings does. That is the existing redundancy
      defect showing up on a new question, not a Canvas defect.

  - id: canvas-code-artefact
    question: Generate a Python code file that defines a dataclass holding IFC's FY24 net income and total assets, with the figures filled in from the knowledge base.
    expected_routes: [knowledge_base]
    tags: [kb, canvas, artefact]
    max_tool_calls: 2
    expects_artefact: true
    artefact_format: code
    artefact_must_contain: ["1485"]
    expects_citation: false
    notes: >-
      artefact_must_contain is "1485" and NOT "1,485", which is the whole point
      of this entry keeping its own note. The first version pinned the
      comma-formatted figure and failed on the first real run against a
      perfectly correct artefact: the agent emitted
      `net_income_usd_millions: int = 1485`, because a Python integer literal
      cannot carry a thousands separator - `1,485` in source is a tuple. The
      check was measuring prose house style in a file where that style is a
      syntax error. Same instrument-defect family as the 80-word decline
      threshold and the citation marker test, found the same way, by reading
      the stored output instead of trusting the count.

      Covers the second output format and the one with an extra required
      argument - "code" is the only format for which Canvas rejects the call
      outright when `language` is missing, so this is also the case that
      exercises the validation-error-then-retry path in step 4 of the planner
      instruction.

      expects_citation is false, and deliberately so rather than by oversight:
      a source file cites in comments, and the citation check looks for URLs or
      document-and-page references in prose. Asserting it here would be the
      same instrument mistake as the 80-word decline threshold - holding output
      to a rule calibrated on a different shape of output.

  - id: canvas-html-multi-source
    question: Produce an HTML briefing page comparing IFC's FY24 net income from the annual report with the current price of Bitcoin.
    expected_routes: [knowledge_base, financial]
    tags: [kb, financial, canvas, artefact, multi_source]
    max_tool_calls: 3
    volatile: true
    expects_artefact: true
    artefact_format: html
    notes: >-
      The third format, and the case that checks Canvas does not disturb
      multi-source routing: the deliverable needs one fact from the knowledge
      base and one from live market data, so it asserts that adding an output
      step leaves the planner's source selection alone.

      volatile because the Bitcoin price moves, so no content assertion is
      pinned - routing, format and the artefact existing are what this scores.
      artefact_must_contain is deliberately empty for the same reason: pinning
      a figure that changes hourly is what replay fixtures exist for, and this
      question earns its keep on structure rather than content.

  - id: canvas-not-requested
    question: What was IFC's net income in FY24?
    expected_routes: [knowledge_base]
    tags: [kb, canvas, negative]
    max_tool_calls: 2
    must_contain: ["1,485"]
    notes: >-
      The over-triggering guard, and the most valuable of the four. A plain
      factual question that must be answered in prose - producing an artefact
      here is a failure, because the user who asked a question would have been
      handed a file. expects_artefact is left false, which is what makes
      check_artefact score it in the negative direction.

      It duplicates kb-net-income's question on purpose. That is not
      redundancy in the dataset: the pair is the control, so if the phase 6
      instruction starts reading ordinary questions as document requests, the
      two entries diverge and say so. Keeping it as its own id rather than
      adding the assertion to kb-net-income keeps the phase 6 guard visible as
      a phase 6 guard.
