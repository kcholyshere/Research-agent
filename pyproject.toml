[project]
name = "research-agent"
version = "0.1.0"
description = "Autonomous research agent (Plan-Execute-Synthesize RAG over ADK), Grid University practice series"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.5.0,<3",
    "google-genai>=2.10.0,<3",
    "python-dotenv>=1.2.2,<2",
    "faiss-cpu>=1.14.3,<2",
    "numpy>=2.5.0,<3",
    "langchain-core>=1.4.8,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-classic>=1.0.8,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "streamlit>=1.51.0,<2",
    "docling>=2.108.0,<3",
    "docling-core>=2.85.0,<3",
    "langfuse>=4.14.1",
    "openinference-instrumentation-google-adk>=0.1.17",
    "mcp>=1.28.1",
    # Declared explicitly rather than relied on transitively via google-adk:
    # the evaluation question set is a YAML deliverable, so a future adk
    # release dropping pyyaml would break the eval rather than just the build.
    "pyyaml>=6.0.3,<7",
]
