[project]
name = "research-agent"
version = "0.1.0"
description = "Autonomous research agent (Plan-Execute-Synthesize RAG over ADK), Grid University practice series"
requires-python = ">=3.13"
dependencies = [
    # The [a2a] extra pulls a2a-sdk, which the phase 5 A2A delegation needs
    # (ADR-0017 revision). ADK ships google.adk.a2a in the base package but
    # every entry point behind it raises missing_extra until a2a-sdk is present,
    # so the extra is not optional for this project - it is the phase 5
    # requirement.
    "google-adk[a2a]>=2.5.0,<3",
    "google-genai>=2.10.0,<3",
    "python-dotenv>=1.2.2,<2",
    "faiss-cpu>=1.14.3,<2",
    "numpy>=2.5.0,<3",
    "langchain-core>=1.4.8,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-classic>=1.0.8,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "streamlit>=1.51.0,<2",
    "docling>=2.108.0,<3",
    "docling-core>=2.85.0,<3",
    "langfuse>=4.14.1",
    "openinference-instrumentation-google-adk>=0.1.17",
    "mcp>=1.28.1",
    # Declared explicitly rather than relied on transitively via google-adk:
    # the evaluation question set is a YAML deliverable, so a future adk
    # release dropping pyyaml would break the eval rather than just the build.
    "pyyaml>=6.0.3,<7",
    # Same reasoning, same precedent - phase 5's News Agent service
    # (src/news_service/server.py) and its client tool
    # (src/tools/news_agent.py) are both on the shipped agent path, not just
    # test/build tooling, but fastapi/uvicorn/httpx were previously only
    # transitive dependencies of google-adk. A future adk release dropping
    # any of them would silently break the A2A demo rather than the build,
    # the same failure mode pyyaml's comment above already flags.
    "fastapi>=0.139.2,<1",
    "uvicorn>=0.51.0,<1",
    "httpx>=0.28.1,<1",
    # Same reasoning again, one level down: src/news_service/server.py imports
    # starlette directly for CardHostMiddleware, rather than only receiving a
    # Starlette app back from ADK's to_a2a. A direct import of a package we
    # only get transitively (via fastapi) is exactly what this block exists to
    # stop being invisible. The bound matches google-adk's own so this
    # declaration records the dependency without narrowing what adk can resolve.
    "starlette>=1.3.1,<2",
]

# Test tooling only, deliberately not in `dependencies`: none of this ships in
# the Docker image, and `uv sync --no-dev` is what the Dockerfile's install
# step resolves. `uv sync` on a developer machine picks the group up by
# default, so `uv run pytest` works with no extra flag.
[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    # Every gate and callback in this project is async or is exercised through
    # an async ADK path (`ToolContext` is built from an `InvocationContext`,
    # which needs `session_service.create_session`), so an async plugin is not
    # optional here.
    "pytest-asyncio>=1.4.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` is imported as a package from the repo root (`from src import config`),
# and there is no installed distribution providing it - pytest's own
# `pythonpath` is what makes that resolve without a conftest sys.path hack.
pythonpath = ["."]
# Strict rather than auto: an async test that silently never ran because the
# marker was missing is the classic way a suite goes green while testing
# nothing, and this project has already been bitten three times by checks that
# fail silently (see CLAUDE.md on reading a turn's answer).
asyncio_mode = "strict"
markers = [
    "integration: needs a live service (Vertex, the FAISS index, or a running container). Deselected by default.",
]
# The default run is the offline suite, so `uv run pytest` is a fast, hermetic,
# always-runnable check. The integration tests are real and are meant to be
# run - `uv run pytest -m integration` - but they are not what gates a commit.
addopts = "-m 'not integration' --strict-markers"
