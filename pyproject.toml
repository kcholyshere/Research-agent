[project]
name = "research-agent"
version = "0.1.0"
description = "Autonomous research agent (Plan-Execute-Synthesize RAG over ADK), Grid University practice series"
requires-python = ">=3.13"
dependencies = [
    # The [a2a] extra pulls a2a-sdk, which the phase 5 A2A delegation needs
    # (ADR-0017 revision). ADK ships google.adk.a2a in the base package but
    # every entry point behind it raises missing_extra until a2a-sdk is present,
    # so the extra is not optional for this project - it is the phase 5
    # requirement.
    "google-adk[a2a]>=2.5.0,<3",
    "google-genai>=2.10.0,<3",
    "python-dotenv>=1.2.2,<2",
    "faiss-cpu>=1.14.3,<2",
    "numpy>=2.5.0,<3",
    "langchain-core>=1.4.8,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-classic>=1.0.8,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "streamlit>=1.51.0,<2",
    "docling>=2.108.0,<3",
    "docling-core>=2.85.0,<3",
    "langfuse>=4.14.1",
    "openinference-instrumentation-google-adk>=0.1.17",
    "mcp>=1.28.1",
    # Declared explicitly rather than relied on transitively via google-adk:
    # the evaluation question set is a YAML deliverable, so a future adk
    # release dropping pyyaml would break the eval rather than just the build.
    "pyyaml>=6.0.3,<7",
    # Same reasoning, same precedent - phase 5's News Agent service
    # (src/news_service/server.py) and its client tool
    # (src/tools/news_agent.py) are both on the shipped agent path, not just
    # test/build tooling, but fastapi/uvicorn/httpx were previously only
    # transitive dependencies of google-adk. A future adk release dropping
    # any of them would silently break the A2A demo rather than the build,
    # the same failure mode pyyaml's comment above already flags.
    "fastapi>=0.139.2,<1",
    "uvicorn>=0.51.0,<1",
    "httpx>=0.28.1,<1",
    # Same reasoning again, one level down: src/news_service/server.py imports
    # starlette directly for CardHostMiddleware, rather than only receiving a
    # Starlette app back from ADK's to_a2a. A direct import of a package we
    # only get transitively (via fastapi) is exactly what this block exists to
    # stop being invisible. The bound matches google-adk's own so this
    # declaration records the dependency without narrowing what adk can resolve.
    "starlette>=1.3.1,<2",
]
